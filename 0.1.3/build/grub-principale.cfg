set timeout=5
set default=0
if [ "$maginat_lang" = it ]; then set tp="Maginat 0.1.2 (con persistenza)"; else set tp="Maginat 0.1.2 (with persistence)"; fi
menuentry "Maginat 0.1.2" {
    linux /boot/vmlinuz maginat.lang=$maginat_lang console=tty0 console=ttyS0,115200
    initrd /boot/microcode.img /boot/initrd.img
}
menuentry "$tp" {
    linux /boot/vmlinuz maginat.persist maginat.lang=$maginat_lang console=tty0 console=ttyS0,115200
    initrd /boot/microcode.img /boot/initrd.img
}
if [ "$maginat_lang" = it ]; then set sg="Maginat (grafica sicura)"; else set sg="Maginat (safe graphics)"; fi
menuentry "$sg" {
    set gfxpayload=keep
    linux /boot/vmlinuz nomodeset maginat.lang=$maginat_lang console=tty0 console=ttyS0,115200
    initrd /boot/microcode.img /boot/initrd.img
}

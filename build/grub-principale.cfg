set timeout=5
set default=0
if [ "$maginat_lang" = it ]; then set tp="Maginat 0.1 (con persistenza)"; else set tp="Maginat 0.1 (with persistence)"; fi
menuentry "Maginat 0.1" {
    linux /boot/vmlinuz maginat.lang=$maginat_lang console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}
menuentry "$tp" {
    linux /boot/vmlinuz maginat.persist maginat.lang=$maginat_lang console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

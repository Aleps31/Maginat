insmod all_video
insmod gfxterm
insmod jpeg
insmod png
loadfont /boot/grub/fonts/unicode.pf2
set gfxmode=1920x1080,1366x768,1280x720,auto
set gfxpayload=keep
terminal_output gfxterm
background_image /boot/grub/themes/magi/background.jpg
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
set timeout=5
set default=0
set timeout=10
menuentry "English" {
    set maginat_lang=en
    export maginat_lang
    configfile /boot/grub/principale.cfg
}
menuentry "Italiano" {
    set maginat_lang=it
    export maginat_lang
    configfile /boot/grub/principale.cfg
}
